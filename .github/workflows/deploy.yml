name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 (matches local dev): `src/lib/*.ts` is imported directly by
          # `node --test` and the content scripts, which rely on Node's built-in
          # type stripping (enabled by default since Node 23.6).
          node-version: 24
          cache: npm
      - run: npm ci
      # Mermaid diagrams are rendered at build time (rehype-mermaid) via Playwright.
      - run: npx playwright install --with-deps chromium
      # Full publish gate (image audit → column audit → tests → type check → build).
      # Mirrors the local pre-push hook so `--no-verify` / manual dispatch still verify.
      - run: npm run publish:check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
