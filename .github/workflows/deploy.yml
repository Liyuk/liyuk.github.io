name: Verify, deploy, and notify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    concurrency:
      group: pages-verify-${{ github.ref }}
      # Superseding a pull-request run is free. Superseding a master run is not:
      # a cancelled run never reaches `notify`, and the next push's
      # `github.event.before` starts *after* the commits it skipped, so their
      # content lands in no notification window at all. Master pushes therefore
      # queue instead of cancelling, keeping the windows contiguous.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      # Mermaid diagrams render through Playwright at build time; browser smoke
      # checks run against the generated dist/ directory in a deterministic server.
      - run: npx playwright install --with-deps chromium
      - run: npm run publish:check
      - run: npm run test:draft:dev
      - run: npm run test:browser:ci
      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: artifacts/browser-checks/
          if-no-files-found: ignore
          retention-days: 14
      # Only a master ref can reach `deploy`, so pull requests skip the Pages
      # API call and the full dist/ upload. Verification itself is unchanged —
      # the production build already ran inside publish:check.
      - uses: actions/configure-pages@v6
        if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/upload-pages-artifact@v5
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          path: ./dist

  deploy:
    name: Deploy GitHub Pages
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    needs: verify
    if: ${{ needs.verify.result == 'success' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  purge:
    name: Purge Cloudflare cache
    concurrency:
      group: cloudflare-purge
      cancel-in-progress: false
    permissions:
      contents: read
    needs: deploy
    # Pages that already had a cached copy -- the home page, the section lists --
    # keep serving it after a deploy, while brand-new URLs are fresh. That is
    # what makes a new entry reachable by link and by RSS but missing from
    # `/writing/`. Runs beside `notify` rather than before it: a stale list page
    # must not hold back a subscriber email, and neither should block the other.
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Purge the zone after deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ZONE_ID != '' }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("success:", d.get("success")); print("errors:", json.dumps(d.get("errors", []), ensure_ascii=False)); sys.exit(0 if d.get("success") else 1)'
      - name: Explain skipped purge
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ZONE_ID == '' }}
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID are not configured; deployed without purging the CDN. List pages may serve a cached copy until their TTL expires."

  notify:
    name: Notify Buttondown subscribers
    concurrency:
      group: buttondown-notify
      cancel-in-progress: false
    permissions:
      contents: read
    needs: deploy
    # A notification failure is intentionally visible and retryable, but it
    # cannot roll back the completed Pages deployment.
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Send new-post emails after deployment
        if: ${{ env.BUTTONDOWN_API_KEY != '' }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/notify-buttondown.mjs --baseRef "$BEFORE" --apply
          else
            # For manual dispatch, the script scans the tree and skips existing
            # messages through its Buttondown idempotency check.
            node scripts/notify-buttondown.mjs --baseRef HEAD --apply
          fi
      - name: Explain skipped notification
        if: ${{ env.BUTTONDOWN_API_KEY == '' }}
        run: echo "BUTTONDOWN_API_KEY is not configured; site deployed without subscriber notification."
