name: Verify, deploy, and notify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    concurrency:
      group: site-verify-${{ github.ref }}
      # Superseding a pull-request run is free. Superseding a master run is not:
      # a cancelled run never reaches `notify`, and the next push's
      # `github.event.before` starts *after* the commits it skipped, so their
      # content lands in no notification window at all. Master pushes therefore
      # queue instead of cancelling, keeping the windows contiguous.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      # Mermaid diagrams render through Playwright at build time; browser smoke
      # checks run against the generated dist/ directory in a deterministic server.
      - run: npx playwright install --with-deps chromium
      - run: npm run publish:check
      - run: npm run test:draft:dev
      - run: npm run test:browser:ci
      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: artifacts/browser-checks/
          if-no-files-found: ignore
          retention-days: 14
      # Pass the verified build to the Cloudflare deployment job. Pull requests
      # do not upload a production artifact.
      - name: Upload verified site
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@v7
        with:
          name: verified-site
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy Cloudflare Pages
    concurrency:
      group: cloudflare-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    needs: verify
    if: ${{ needs.verify.result == 'success' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@v7
        with:
          name: verified-site
          path: dist/
      - name: Deploy verified build to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch master

  notify:
    name: Notify Buttondown subscribers
    concurrency:
      group: buttondown-notify
      cancel-in-progress: false
    permissions:
      contents: read
    needs: deploy
    # A notification failure is intentionally visible and retryable, but it
    # cannot roll back the completed Cloudflare Pages deployment.
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Send new-post emails after deployment
        if: ${{ env.BUTTONDOWN_API_KEY != '' }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/notify-buttondown.mjs --baseRef "$BEFORE" --apply
          else
            # For manual dispatch, the script scans the tree and skips existing
            # messages through its Buttondown idempotency check.
            node scripts/notify-buttondown.mjs --baseRef HEAD --apply
          fi
      - name: Explain skipped notification
        if: ${{ env.BUTTONDOWN_API_KEY == '' }}
        run: echo "BUTTONDOWN_API_KEY is not configured; site deployed without subscriber notification."
