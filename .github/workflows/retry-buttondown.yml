name: Retry Buttondown notification

on:
  workflow_dispatch:
    inputs:
      entry_key:
        description: 'Exact published content key, such as projects/2026/10/liyuk-skills'
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Retry one published entry
    concurrency:
      group: buttondown-notify
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENTRY_KEY: ${{ inputs.entry_key }}
    steps:
      - name: Require the deployed master branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Retry notifications from master, after its site deployment succeeded."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Send the selected notification if it is still missing
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: node scripts/notify-buttondown.mjs --entry "$ENTRY_KEY" --apply
