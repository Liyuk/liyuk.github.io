version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro-and-content-tooling:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'remark-*'
          - 'rehype-*'
      test-tooling:
        patterns:
          - 'playwright'
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
