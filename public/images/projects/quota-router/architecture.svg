<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif" viewBox="0 0 860 500"><path fill="#f8fafc" d="M0 0h860v500H0z"/><text x="430" y="34" fill="#0f172a" font-size="19" font-weight="700" text-anchor="middle">Quota Router 在 DSH 中的位置</text><rect width="740" height="70" x="60" y="60" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5" rx="10"/><text x="430" y="88" fill="#3730a3" font-size="15" font-weight="700" text-anchor="middle">用户消息 / Agent 回合</text><text x="430" y="110" fill="#4338ca" font-size="12" text-anchor="middle">「帮我修复这个并发 deadlock」</text><path stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" d="M430 130v28"/><rect width="640" height="180" x="110" y="160" fill="#fff" stroke="#2563eb" stroke-width="2" rx="12"/><text x="430" y="186" fill="#1d4ed8" font-size="15" font-weight="700" text-anchor="middle">dsh-quota-router（纯策略层）</text><rect width="180" height="120" x="130" y="200" fill="#eff6ff" stroke="#93c5fd" rx="8"/><text x="220" y="222" fill="#1e40af" font-size="12.5" font-weight="700" text-anchor="middle">问题 1：先用哪个来源</text><text x="220" y="244" fill="#334155" font-size="11.5" text-anchor="middle">sources[].priority</text><text x="220" y="264" fill="#334155" font-size="11.5" text-anchor="middle">subscription → free → paid</text><text x="220" y="284" fill="#334155" font-size="11.5" text-anchor="middle">paid 需显式 opt-in</text><text x="220" y="304" fill="#334155" font-size="11.5" text-anchor="middle">manual/emergency 永不自动</text><rect width="180" height="120" x="340" y="200" fill="#eff6ff" stroke="#93c5fd" rx="8"/><text x="430" y="222" fill="#1e40af" font-size="12.5" font-weight="700" text-anchor="middle">问题 2：该任务用哪个模型</text><text x="430" y="244" fill="#334155" font-size="11.5" text-anchor="middle">profiles[].modelBySource</text><text x="430" y="264" fill="#334155" font-size="11.5" text-anchor="middle">coding → luna</text><text x="430" y="284" fill="#334155" font-size="11.5" text-anchor="middle">hard-coding → terra</text><text x="430" y="304" fill="#334155" font-size="11.5" text-anchor="middle">first-match 关键词</text><rect width="180" height="120" x="550" y="200" fill="#f0fdf4" stroke="#86efac" rx="8"/><text x="640" y="222" fill="#15803d" font-size="12.5" font-weight="700" text-anchor="middle">保障机制</text><text x="640" y="244" fill="#334155" font-size="11.5" text-anchor="middle">DSH 原生模型校验</text><text x="640" y="264" fill="#334155" font-size="11.5" text-anchor="middle">per-turn 决策身份</text><text x="640" y="284" fill="#334155" font-size="11.5" text-anchor="middle">forward-only fallback</text><text x="640" y="304" fill="#334155" font-size="11.5" text-anchor="middle">cooldown + ledger</text><path stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" d="M430 340v28"/><rect width="740" height="100" x="60" y="370" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="10"/><text x="430" y="396" fill="#334155" font-size="15" font-weight="700" text-anchor="middle">DSH 原生层（router 从不越权）</text><text x="430" y="420" fill="#475569" font-size="12" text-anchor="middle">provider 注册 · 凭据 · 模型目录 · adapter retry · 上下文压缩</text><text x="430" y="444" fill="#475569" font-size="12" text-anchor="middle">router 只写 request/header 中已通过校验的 provider/model/reasoningEffort</text><defs><marker id="a" markerHeight="9" markerWidth="9" orient="auto" refX="7" refY="4.5"><path fill="#64748b" d="m0 0 9 4.5L0 9z"/></marker></defs></svg>