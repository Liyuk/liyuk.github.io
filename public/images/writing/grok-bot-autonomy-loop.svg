<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" role="img" aria-labelledby="grok-bot-autonomy-loop-title grok-bot-autonomy-loop-desc" id="grok-bot-autonomy-loop-root">
<title id="grok-bot-autonomy-loop-title">多任务自执行循环</title><desc id="grok-bot-autonomy-loop-desc">目标和任务状态持续写入共享状态库。调度器拆解依赖并发派发，隔离执行后进行机器测试和独立验收，再写回结果并决定继续或向人请求判断。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #grok-bot-autonomy-loop-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;--accent-tint:rgba(191,69,32,.08);--sans:'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #grok-bot-autonomy-loop-root { color: var(--ink); font-family: var(--sans); }
      #grok-bot-autonomy-loop-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#grok-bot-autonomy-loop-root .diagram-container { overflow:visible }
}
      #grok-bot-autonomy-loop-root .ring { fill:none;stroke:var(--muted);stroke-width:1.2 }
      #grok-bot-autonomy-loop-root .spoke { fill:none;stroke:var(--soft);stroke-width:1;stroke-dasharray:5 4 }
      #grok-bot-autonomy-loop-root .station { fill:var(--paper);stroke:var(--ink);stroke-width:1 }
      #grok-bot-autonomy-loop-root .station.focal { fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2 }
      #grok-bot-autonomy-loop-root .node-name { fill:var(--ink);font:600 14px var(--sans);text-anchor:middle }
      #grok-bot-autonomy-loop-root .focal-name { fill:var(--accent) }
      #grok-bot-autonomy-loop-root .sublabel { fill:var(--soft);font:400 9px var(--mono);text-anchor:middle }
      #grok-bot-autonomy-loop-root .hub { fill:var(--ink) }
      #grok-bot-autonomy-loop-root .hub-name { fill:var(--paper);font:600 17px var(--sans);text-anchor:middle }
      #grok-bot-autonomy-loop-root .hub-sub { fill:var(--paper);opacity:.8;font:400 9px var(--mono);text-anchor:middle }
      #grok-bot-autonomy-loop-root .legend { fill:var(--muted);font:400 12px var(--sans) }</style><marker id="grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#5a6580"/></marker></defs>
<rect width="1120" height="840" fill="#f5f5f5"/>
<path class="ring" d="M 652 145.664 A 278 278 0 0 1 742.029 197.882" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow)"/><path class="ring" d="M 801.711 270.67 A 278 278 0 0 1 836.904 432.666" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow)"/><path class="ring" d="M 820.206 505.861 A 278 278 0 0 1 737.805 621.704" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow)"/><path class="ring" d="M 588.62 684.523 A 278 278 0 0 1 532.574 684.644" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow)"/><path class="ring" d="M 383.119 622.469 A 278 278 0 0 1 300.219 506.983" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow)"/><path class="ring" d="M 283.205 433.861 A 278 278 0 0 1 317.698 271.714" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow)"/><path class="ring" d="M 377.066 198.67 A 278 278 0 0 1 466.868 146.064" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow)"/>
<path class="spoke" d="M 560 166 L 560 346" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow-soft)"/><path class="spoke" d="M 732.207 270.67 L 634.913 348.259" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow-soft)"/><path class="spoke" d="M 739.03 448.862 L 677.85 434.898" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow-soft)"/><path class="spoke" d="M 663.283 622.469 L 589.571 469.406" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow-soft)"/><path class="spoke" d="M 456.717 622.469 L 530.429 469.406" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow-soft)"/><path class="spoke" d="M 380.97 448.862 L 442.15 434.898" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow-soft)"/><path class="spoke" d="M 387.793 270.67 L 485.087 348.259" marker-end="url(#grok-bot-autonomy-loop-grok-bot-autonomy-loop-arrow-soft)"/>
<g><rect class="station" x="468" y="94" width="184" height="72" rx="6"/><text x="560" y="124" class="node-name-name">目标与触发</text><text x="560" y="146" class="sublabel">goal version / event</text></g><g><rect class="station" x="685.349" y="198.67" width="184" height="72" rx="6"/><text x="777.349" y="228.67" class="node-name-name">拆解与排队</text><text x="777.349" y="250.67" class="sublabel">dependencies / priority</text></g><g><rect class="station" x="739.03" y="433.861" width="184" height="72" rx="6"/><text x="831.03" y="463.861" class="node-name-name">并发派发</text><text x="831.03" y="485.861" class="sublabel">owner / budget / slots</text></g><g><rect class="station" x="588.62" y="622.469" width="184" height="72" rx="6"/><text x="680.62" y="652.469" class="node-name-name">沙盒执行</text><text x="680.62" y="674.469" class="sublabel">isolated workspaces</text></g><g><rect class="station focal" x="347.38" y="622.469" width="184" height="72" rx="6"/><text x="439.38" y="652.469" class="node-name focal-name">双路验收</text><text x="439.38" y="674.469" class="sublabel">tests + independent review</text></g><g><rect class="station" x="196.97" y="433.861" width="184" height="72" rx="6"/><text x="288.97" y="463.861" class="node-name-name">回写真实状态</text><text x="288.97" y="485.861" class="sublabel">artifacts / evidence</text></g><g><rect class="station" x="250.651" y="198.67" width="184" height="72" rx="6"/><text x="342.651" y="228.67" class="node-name-name">决定下一步</text><text x="342.651" y="250.67" class="sublabel">continue / ask human</text></g>
<rect class="hub" x="448.0" y="352.0" width="224" height="112" rx="8"/>
<text class="hub-name" x="560" y="400">持久任务状态</text><text class="hub-sub" x="560" y="428">goal · owner · evidence · budget</text>
<text class="legend" x="48" y="790">实线：任务推进　　虚线：每轮结果写回共享状态　　橙色：交付验收关口</text>
</svg>
