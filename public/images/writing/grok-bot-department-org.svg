<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="grok-bot-department-org-title grok-bot-department-org-desc"><title id="grok-bot-department-org-title">Department ownership and escalation</title><desc id="grok-bot-department-org-desc">A proposed department structure: a human sets goals, Grok coordinates engineering and quantitative-research chiefs, and each chief assigns implementation, testing, research, and review agents.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker></defs><rect class="bg" width="100%" height="100%"/><style>text{font-family:Geist,'Noto Sans SC',Arial,sans-serif;fill:#2d3142}.bg{fill:#f5f5f5}.node{fill:#f5f5f5;stroke:#2d3142;stroke-width:1.2}.focal{fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-width:1.5}.name{font-size:15px;font-weight:600;text-anchor:middle}.sub{font-size:10px;fill:#5a6580;text-anchor:middle}.line{fill:none;stroke:#4f5d75;stroke-width:1.4;marker-end:url(#arrow)}.dashed{stroke-dasharray:5 4}.title{font-size:12px;fill:#4f5d75;letter-spacing:1.4px}</style><text class="title" x="56" y="34">PROPOSED DEPARTMENT ORGANIZATION</text><path class="line" d="M500 128V174"/><path class="line" d="M500 242V264H250V290"/><path class="line" d="M500 264H750V290"/><path class="line" d="M250 358V410"/><path class="line" d="M750 358V410"/><path class="line dashed" d="M390 324H610"/><g><rect class="node" x="360" y="60" width="280" height="68" rx="6"/><text class="name" x="500.0" y="89">Human owner</text><text class="sub" x="500.0" y="109">goal · priority · decisions</text></g><g><rect class="node focal" x="360" y="174" width="280" height="68" rx="6"/><text class="name" x="500.0" y="203">Grok global chief</text><text class="sub" x="500.0" y="223">portfolio · routing · escalation</text></g><g><rect class="node" x="110" y="290" width="280" height="68" rx="6"/><text class="name" x="250.0" y="319">Engineering chief</text><text class="sub" x="250.0" y="339">delivery · code · review</text></g><g><rect class="node" x="610" y="290" width="280" height="68" rx="6"/><text class="name" x="750.0" y="319">Quant research chief</text><text class="sub" x="750.0" y="339">experiments · evidence · selection</text></g><g><rect class="node" x="110" y="410" width="280" height="68" rx="6"/><text class="name" x="250.0" y="439">Engineering agents</text><text class="sub" x="250.0" y="459">implementation · test · review</text></g><g><rect class="node" x="610" y="410" width="280" height="68" rx="6"/><text class="name" x="750.0" y="439">Research agents</text><text class="sub" x="750.0" y="459">experiment · replication · audit</text></g><text class="sub" x="500" y="530">Cross-department discussion is reserved for shared decisions and unresolved conflicts.</text></svg>