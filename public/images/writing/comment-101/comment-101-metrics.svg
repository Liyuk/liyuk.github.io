<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comment-101-metrics-title comment-101-metrics-desc" id="comment-101-metrics-root">
<title id="comment-101-metrics-title">From exposure to task outcome</title>
<desc id="comment-101-metrics-desc">This is an analysis path, not a conversion funnel. Check denominators and guardrails at every step.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #comment-101-metrics-root { color: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #comment-101-metrics-root .diagram-container { width:100%;max-width:100%;min-width:0;overflow-x:auto }
      @media print {
#comment-101-metrics-root .diagram-container { overflow-x:visible }
}</style><marker id="comment-101-metrics-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="comment-101-metrics-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><pattern id="comment-101-metrics-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/></pattern></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="34" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >DATA ANALYSIS / MEASUREMENT PATH</text><text x="40" y="68" fill="#2d3142" font-size="24" font-weight="500" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" text-anchor="start" >From exposure to task outcome: measure every step</text><text x="40" y="92" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >This is an analysis path, not a conversion funnel. Check denominators and guardrails at every step.</text><path d="M 190,214 L 208,214" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-metrics-arrow)"/><path d="M 376,214 L 394,214" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-metrics-arrow)"/><path d="M 562,214 L 580,214" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-metrics-arrow)"/><path d="M 748,214 L 766,214" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-metrics-arrow)"/><rect x="32" y="148" width="152" height="132" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><rect x="44" y="160" width="28" height="20" rx="2" fill="#ececec" stroke="none" stroke-width="0"/><text x="58" y="175" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >01</text><text x="44" y="207" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Opportunity to see</text><text x="44" y="235" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Eligible impressions</text><text x="44" y="257" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Ranking position</text><rect x="218" y="148" width="152" height="132" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><rect x="230" y="160" width="28" height="20" rx="2" fill="#ececec" stroke="none" stroke-width="0"/><text x="244" y="175" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >02</text><text x="230" y="207" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Meaningful consumption</text><text x="230" y="235" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Read / expand</text><text x="230" y="257" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Meaningful viewing</text><rect x="404" y="148" width="152" height="132" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><rect x="416" y="160" width="28" height="20" rx="2" fill="#ececec" stroke="none" stroke-width="0"/><text x="430" y="175" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >03</text><text x="416" y="207" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Meaningful interaction</text><text x="416" y="235" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Like / save</text><text x="416" y="257" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Answer / negative feedback</text><rect x="590" y="148" width="152" height="132" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/><rect x="602" y="160" width="28" height="20" rx="2" fill="#bf4520" stroke="none" stroke-width="0"/><text x="616" y="175" fill="#ffffff" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >04</text><text x="602" y="207" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Task outcome</text><text x="602" y="235" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Problem resolved</text><text x="602" y="257" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Purchase / continue reading</text><rect x="776" y="148" width="152" height="132" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><rect x="788" y="160" width="28" height="20" rx="2" fill="#ececec" stroke="none" stroke-width="0"/><text x="802" y="175" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >05</text><text x="788" y="207" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Later reuse</text><text x="788" y="235" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Return / search again</text><text x="788" y="257" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Repeat purchase / retention</text><rect x="64" y="338" width="832" height="82" rx="5" fill="#ececec" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="84" y="366" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Quality guardrails throughout</text><text x="84" y="395" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Safety and trust · content quality · user experience · creator workload · incentive and moderation cost</text><path d="M 480,280 L 480,308 Q 480,316 480,324 L 480,338" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="64" y1="448" x2="896" y2="448" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="480" y="478" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >First confirm users had a chance to see the comment, then compare behavior and outcomes. Treat dwell time as diagnostic; use a control to measure lift.</text>
</svg>
