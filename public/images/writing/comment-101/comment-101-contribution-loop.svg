<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comment-101-contribution-loop-title comment-101-contribution-loop-desc" id="comment-101-contribution-loop-root">
<title id="comment-101-contribution-loop-title">Comment contribution and incentives</title>
<desc id="comment-101-contribution-loop-desc">How prompts, contributions, confirmation, recognition, and return visits support useful experience, with quality, workload, and anti-abuse guardrails.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #comment-101-contribution-loop-root { color: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #comment-101-contribution-loop-root .diagram-container { width:100%;max-width:100%;min-width:0;overflow-x:auto }
      @media print {
#comment-101-contribution-loop-root .diagram-container { overflow-x:visible }
}</style><marker id="comment-101-contribution-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="comment-101-contribution-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><pattern id="comment-101-contribution-loop-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/></pattern></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="34" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >PRODUCT DESIGN / CONTRIBUTION LOOP</text><text x="40" y="68" fill="#2d3142" font-size="24" font-weight="500" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" text-anchor="start" >Reward useful contributions, not mechanical check-ins</text><text x="40" y="92" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Tasks, recognition, and return visits should support contribution value; track abuse and workload as guardrails</text><rect x="50" y="168" width="176" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="138" y="198" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Raise an</text><text x="138" y="222" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >unanswered question</text><text x="138" y="251" fill="#5a6580" font-size="10" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Task prompt</text><rect x="278" y="168" width="176" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="366" y="198" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Add a</text><text x="366" y="222" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >specific experience</text><text x="366" y="251" fill="#5a6580" font-size="10" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Contribution</text><rect x="506" y="168" width="176" height="104" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.1" fill-opacity="0.08"/><text x="594" y="198" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Get confirmation</text><text x="594" y="222" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Accepted / reused</text><text x="594" y="251" fill="#5a6580" font-size="10" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Value confirmed</text><rect x="734" y="168" width="176" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="822" y="198" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Receive recognition</text><text x="822" y="222" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Thanks / milestone</text><text x="822" y="251" fill="#5a6580" font-size="10" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Immediate feedback</text><path d="M 226,220 L 278,220" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-contribution-loop-arrow)"/><path d="M 454,220 L 506,220" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-contribution-loop-arrow)"/><path d="M 682,220 L 734,220" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-contribution-loop-arrow)"/><path d="M 822,272 L 822,340 Q 822,348 814,348 L 146,348 Q 138,348 138,340 L 138,272" fill="none" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#comment-101-contribution-loop-arrow)"/><rect x="240" y="364" width="480" height="52" rx="5" fill="#ececec" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="480" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Reasons to return: retrieve experience · update outcomes · help the next user</text><text x="480" y="405" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Let users pause or revisit tasks. Do not reward positive sentiment or raw comment volume.</text><rect x="50" y="456" width="400" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="250" y="482" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Contribution quality</text><text x="250" y="507" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Resolution · reuse · answerer retention · time to first answer for newcomers</text><text x="250" y="530" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Contribution concentration · author and moderator workload</text><rect x="510" y="456" width="400" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="710" y="482" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Quality and anti-abuse guardrails</text><text x="710" y="507" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Vote rings · repetitive spam · incentive bias · reports and appeals</text><text x="710" y="530" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Coupon cost · rating anomalies · community safety</text>
</svg>
