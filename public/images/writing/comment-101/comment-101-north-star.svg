<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comment-101-north-star-title comment-101-north-star-desc" id="comment-101-north-star-root">
<title id="comment-101-north-star-title">Comment metrics: outcomes, drivers, and guardrails</title>
<desc id="comment-101-north-star-desc">Use task resolution as the North Star; other metrics explain change and quality guardrails stand on their own.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #comment-101-north-star-root { color: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #comment-101-north-star-root .diagram-container { width:100%;max-width:100%;min-width:0;overflow-x:auto }
      @media print {
#comment-101-north-star-root .diagram-container { overflow-x:visible }
}</style><marker id="comment-101-north-star-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="comment-101-north-star-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><pattern id="comment-101-north-star-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/></pattern></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="34" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >DATA ANALYSIS / NORTH-STAR TREE</text><text x="40" y="68" fill="#2d3142" font-size="24" font-weight="500" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" text-anchor="start" >Comment metrics: separate outcomes, drivers, and guardrails</text><text x="40" y="92" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Use task resolution as the North Star; other metrics explain changes and do not cancel each other out</text><path d="M 480,188 L 480,220" fill="none" stroke="#4f5d75" stroke-width="1.4"/><line x1="120" y1="220" x2="824" y2="220" stroke="#4f5d75" stroke-width="1.2"/><path d="M 120,220 L 120,264" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-north-star-arrow)"/><path d="M 296,220 L 296,264" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-north-star-arrow)"/><path d="M 472,220 L 472,264" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-north-star-arrow)"/><path d="M 648,220 L 648,264" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-north-star-arrow)"/><path d="M 824,220 L 824,264" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-north-star-arrow)"/><rect x="220" y="112" width="520" height="76" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/><text x="480" y="140" fill="#bf4520" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >North Star · practical experience / knowledge content</text><text x="480" y="167" fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Weekly discussions users confirm as resolved</text><rect x="40" y="264" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="54" y="288" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Outcome</text><text x="54" y="316" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Resolved discussions</text><text x="54" y="344" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >By topic / user</text><text x="54" y="362" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Segment by source</text><rect x="216" y="264" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="230" y="288" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Drivers</text><text x="230" y="316" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Impression → answer</text><text x="230" y="344" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Question rate · time to first answer</text><text x="230" y="362" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Acceptance and resolution</text><rect x="392" y="264" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="406" y="288" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Business</text><text x="406" y="316" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Retention and net LTV</text><text x="406" y="344" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >7 / 30 / 90 days</text><text x="406" y="362" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Cohort / net cost</text><rect x="568" y="264" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="582" y="288" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Guardrails</text><text x="582" y="316" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Safety and workload</text><text x="582" y="344" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Reports / false decisions</text><text x="582" y="362" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Churn / cost</text><rect x="744" y="264" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="758" y="288" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Diagnostics</text><text x="758" y="316" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Explain variation</text><text x="758" y="344" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Entry point / ranking</text><text x="758" y="362" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Author response</text><rect x="120" y="428" width="720" height="66" rx="5" fill="#ececec" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="480" y="454" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Proxy metrics are not final outcomes</text><text x="480" y="478" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Measure lift and later reuse. Evaluate quality guardrails separately instead of folding them into a score that traffic can offset.</text>
</svg>
