<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">The evidence chain behind an experiment</title><desc id="desc">Check instrumentation, assignment, design, outcomes, proxies, and long-term effects before shipping, adjusting, or rolling back.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#4f5d75"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#2d3142}.muted{fill:#4f5d75}.card{fill:#fff;stroke:#2d3142;stroke-opacity:.18}.accent{fill:#bf4520}</style></defs>
<rect width="960" height="560" fill="#f5f5f5"/><text x="36" y="34" class="muted" font-size="12" font-weight="700" letter-spacing="1">DATA ANALYSIS / EXPERIMENT VALIDITY</text><text x="36" y="70" font-size="24" font-weight="700">Trustworthy results depend on the full evidence chain</text><text x="36" y="98" class="muted" font-size="14">A/B/n, factorial, and concurrent tests are design options; choose a randomization unit that reflects how comments spread</text>
<g stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"><path d="M210 208h26"/><path d="M438 208h26"/><path d="M666 208h26"/></g>
<rect class="card" x="34" y="142" width="176" height="134" rx="8"/><text x="50" y="171" class="muted" font-size="12" font-weight="700">01 / INSTRUMENT</text><text x="50" y="204" font-size="17" font-weight="700">Instrumentation and assignment</text><text x="50" y="232" class="muted" font-size="13">Exposure · position · version</text><text x="50" y="254" class="muted" font-size="13">A/A test · sample-ratio check</text>
<rect x="262" y="142" width="176" height="134" rx="8" fill="#fff8f5" stroke="#bf4520" stroke-width="1.5"/><text x="278" y="171" class="accent" font-size="12" font-weight="700">02 / DESIGN</text><text x="278" y="204" font-size="17" font-weight="700">Choose a design</text><text x="278" y="232" class="muted" font-size="13">A/B/n · factorial · concurrent</text><text x="278" y="254" class="muted" font-size="13">User · content · community</text>
<rect class="card" x="490" y="142" width="176" height="134" rx="8"/><text x="506" y="171" class="muted" font-size="12" font-weight="700">03 / EVALUATE</text><text x="506" y="204" font-size="17" font-weight="700">Outcomes and guardrails</text><text x="506" y="232" class="muted" font-size="13">Task outcomes · segment differences</text><text x="506" y="254" class="muted" font-size="13">Safety · cost · supply</text>
<rect class="card" x="718" y="142" width="208" height="134" rx="8"/><text x="734" y="171" class="muted" font-size="12" font-weight="700">04 / CALIBRATE</text><text x="734" y="204" font-size="17" font-weight="700">Calibrate proxy metrics</text><text x="734" y="232" class="muted" font-size="13">Compare with long-term task outcomes</text><text x="734" y="254" class="muted" font-size="13">Holdout · later return visits</text>
<rect x="74" y="326" width="812" height="88" rx="8" fill="#ececec" stroke="#2d3142" stroke-opacity=".18"/><text x="480" y="357" text-anchor="middle" font-size="15" font-weight="700">Proxy metrics cannot replace product outcomes</text><text x="480" y="384" text-anchor="middle" class="muted" font-size="13">If expansion, likes, or time spent rise, check that resolution, contributor retention, returns, and support outcomes remain healthy</text>
<path d="M480 414v28" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="194" y="450" width="572" height="70" rx="8" fill="#fff8f5" stroke="#bf4520" stroke-opacity=".45"/><text x="480" y="480" text-anchor="middle" font-size="16" font-weight="700">Ship / adjust / roll back</text><text x="480" y="503" text-anchor="middle" class="muted" font-size="13">Check whether lift holds, long-term outcomes agree, and guardrails stay within bounds</text>
</svg>
