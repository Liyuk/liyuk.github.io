<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comment-101-product-architecture-title comment-101-product-architecture-desc" id="comment-101-product-architecture-root">
<title id="comment-101-product-architecture-title">Comment product architecture</title>
<desc id="comment-101-product-architecture-desc">Help people express themselves, find answers, and keep contributing within clear trust boundaries.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #comment-101-product-architecture-root { color: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #comment-101-product-architecture-root .diagram-container { width:100%;max-width:100%;min-width:0;overflow-x:auto }
      @media print {
#comment-101-product-architecture-root .diagram-container { overflow-x:visible }
}</style><marker id="comment-101-product-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="comment-101-product-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><pattern id="comment-101-product-architecture-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/></pattern></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="34" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >PRODUCT DESIGN / CAPABILITY MAP</text><text x="40" y="68" fill="#2d3142" font-size="24" font-weight="500" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" text-anchor="start" >Comment product architecture</text><text x="40" y="92" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Help people express themselves, find answers, and keep contributing within clear trust boundaries</text><rect x="96" y="112" width="768" height="54" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/><text x="480" y="136" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Product goal</text><text x="480" y="156" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Help users complete their task and make useful experience discoverable and reusable</text><rect x="44" y="224" width="204" height="150" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><rect x="58" y="240" width="28" height="20" rx="3" fill="#ececec" stroke="none" stroke-width="0"/><text x="72" y="255" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >01</text><text x="98" y="256" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Expression and submission</text><line x1="58" y1="272" x2="234" y2="272" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="58" y="306" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Text / media</text><text x="58" y="330" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Questions / reviews / corrections</text><rect x="264" y="224" width="204" height="150" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><rect x="278" y="240" width="28" height="20" rx="3" fill="#ececec" stroke="none" stroke-width="0"/><text x="292" y="255" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >02</text><text x="318" y="256" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Conversation and co-creation</text><line x1="278" y1="272" x2="454" y2="272" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="278" y="306" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Replies / votes / author responses</text><text x="278" y="330" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Accept / pin / cite</text><rect x="484" y="224" width="204" height="150" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><rect x="498" y="240" width="28" height="20" rx="3" fill="#ececec" stroke="none" stroke-width="0"/><text x="512" y="255" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >03</text><text x="538" y="256" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Discovery and decisions</text><line x1="498" y1="272" x2="674" y2="272" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="498" y="306" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Newest / popular / Q&amp;A</text><text x="498" y="330" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Topic filters / summaries</text><rect x="704" y="224" width="204" height="150" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><rect x="718" y="240" width="28" height="20" rx="3" fill="#ececec" stroke="none" stroke-width="0"/><text x="732" y="255" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" >04</text><text x="758" y="256" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Contribution and return</text><line x1="718" y1="272" x2="894" y2="272" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="718" y="306" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Tasks / recognition / membership</text><text x="718" y="330" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Saved items / follows</text><path d="M 248,299 L 260,299" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-product-architecture-arrow)"/><path d="M 468,299 L 480,299" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-product-architecture-arrow)"/><path d="M 688,299 L 700,299" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-product-architecture-arrow)"/><rect x="44" y="414" width="872" height="62" rx="5" fill="#ececec" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="64" y="439" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Governance across every capability</text><text x="64" y="461" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Visibility and appeals · anti-abuse and anti-fraud · incentive disclosure · author and user permissions · media privacy</text><rect x="96" y="512" width="768" height="54" rx="5" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="480" y="535" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Feed user outcomes back into product decisions: resolution, reuse, creator workload, and community trust</text><text x="480" y="554" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Let each business choose the capabilities it needs; do not impose one comment format everywhere</text>
</svg>
