<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comment-101-moderation-title comment-101-moderation-desc" id="comment-101-moderation-root">
<title id="comment-101-moderation-title">Moderation combines automated triage, human review, and sampling</title>
<desc id="comment-101-moderation-desc">Low-risk comments may be published automatically; uncertain and high-risk cases take different paths.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #comment-101-moderation-root { color: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #comment-101-moderation-root .diagram-container { width:100%;max-width:100%;min-width:0;overflow-x:auto }
      @media print {
#comment-101-moderation-root .diagram-container { overflow-x:visible }
}</style><marker id="comment-101-moderation-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="comment-101-moderation-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><pattern id="comment-101-moderation-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/></pattern></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="34" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >GOVERNANCE / REVIEW HANDOFFS</text><text x="40" y="68" fill="#2d3142" font-size="24" font-weight="500" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" text-anchor="start" >Moderation combines automated triage, human review, and sampling</text><text x="40" y="92" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Low-risk comments may be published automatically; uncertain and high-risk cases take different paths</text><rect x="126" y="112" width="802" height="78" fill="#2d3142" stroke="none" fill-opacity="0.025"/><line x1="126" y1="112" x2="928" y2="112" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.16"/><text x="28" y="156" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >User submission</text><line x1="126" y1="190" x2="928" y2="190" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.16"/><text x="28" y="234" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Automated moderation and risk controls</text><rect x="126" y="268" width="802" height="78" fill="#2d3142" stroke="none" fill-opacity="0.025"/><line x1="126" y1="268" x2="928" y2="268" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.16"/><text x="28" y="312" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Human review</text><line x1="126" y1="346" x2="928" y2="346" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.16"/><text x="28" y="390" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Visibility state</text><rect x="126" y="424" width="802" height="78" fill="#2d3142" stroke="none" fill-opacity="0.025"/><line x1="126" y1="424" x2="928" y2="424" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.16"/><text x="28" y="468" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >AI sampling</text><line x1="126" y1="502" x2="928" y2="502" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.16"/><line x1="126" y1="112" x2="126" y2="502" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.16"/><path d="M 236,151 L 342,151 Q 350,151 350,159 L 350,229" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-moderation-arrow)"/><path d="M 470,229 L 508,229 Q 516,229 516,237 L 516,307" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-moderation-arrow)"/><path d="M 470,220 L 842,220 Q 850,220 850,228 L 850,385" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-moderation-arrow)"/><path d="M 350,268 L 350,397 Q 350,405 358,405 L 748,405" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-moderation-arrow)"/><path d="M 586,346 L 610,346" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-moderation-arrow)"/><path d="M 516,346 L 516,358 Q 516,366 524,366 L 828,366 Q 836,366 836,374 L 836,385" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-moderation-arrow)"/><path d="M 748,346 L 748,357 Q 748,365 756,365 L 867,365 Q 875,365 875,373 L 875,385" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-moderation-arrow)"/><path d="M 836,433 L 836,447 Q 836,455 828,455 L 698,455 Q 690,455 690,459 L 690,463" fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#comment-101-moderation-arrow)"/><path d="M 748,502 L 770,502" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-moderation-arrow)"/><rect x="76" y="128" width="160" height="46" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="156" y="157" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Submit comment</text><rect x="282" y="206" width="188" height="48" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/><text x="376" y="228" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Automated screening</text><text x="376" y="246" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Rules + models</text><rect x="440" y="284" width="146" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="513" y="306" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >First review</text><text x="513" y="324" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Classify and check evidence</text><rect x="610" y="284" width="138" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="679" y="306" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Second review</text><text x="679" y="324" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Dispute / appeal</text><rect x="748" y="385" width="180" height="48" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/><text x="838" y="407" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Publish / hold / reject</text><text x="838" y="425" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Decide by risk and evidence</text><rect x="612" y="463" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="680" y="485" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Risk-based AI sampling</text><text x="680" y="503" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Check missed and false blocks</text><rect x="770" y="463" width="158" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="849" y="485" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Calibrate rules and models</text><text x="849" y="503" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Feed results into moderation policy</text><text x="500" y="560" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Sample both approved and blocked comments. Sampling checks quality; it is not a serial review step for every comment.</text>
</svg>
