sition · expansion · valid likes</text><rect x="456" y="390" width="368" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="476" y="422" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Recommendation features</text><text x="476" y="450" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Position-corrected behavior and semantics</text><text x="476" y="474" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Training labels include time windows and versions</text><rect x="856" y="390" width="368" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="876" y="422" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Search and AI search</text><text x="876" y="450" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Entities · originals · provenance</text><text x="876" y="474" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Invalidate downstream data after hiding or withdrawal</text><rect x="240" y="580" width="800" height="56" rx="5" fill="#ececec" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="640" y="604" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Edit · delete · appeal reversal</text><text x="640" y="624" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" >Append an audit event; withdraw or recompute counters, caches, indexes, and training examples</text>
