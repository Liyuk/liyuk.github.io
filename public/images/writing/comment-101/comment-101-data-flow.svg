<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comment-101-data-flow-title comment-101-data-flow-desc" id="comment-101-data-flow-root">
<title id="comment-101-data-flow-title">Comment processing and trusted data flow</title>
<desc id="comment-101-data-flow-desc">Preserve originals and context, then normalize, moderate, enrich, and build downstream views for ranking, recommendations, and search.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #comment-101-data-flow-root { color: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #comment-101-data-flow-root .diagram-container { width:100%;max-width:100%;min-width:0;overflow-x:auto }
      @media print {
#comment-101-data-flow-root .diagram-container { overflow-x:visible }
}</style><marker id="comment-101-data-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="comment-101-data-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><pattern id="comment-101-data-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#2d3142" fill-opacity="0.08"/></pattern></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="40" y="34" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >TECHNICAL ARCHITECTURE / COMMENT DATA FLOW</text><text x="40" y="68" fill="#2d3142" font-size="24" font-weight="500" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif" text-anchor="start" >Comment processing: preserve context, then build trusted views</text><text x="40" y="92" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Keep originals intact. Moderation, semantics, and governance state determine downstream eligibility</text><path d="M 232,218 L 274,218" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-data-flow-arrow)"/><path d="M 478,218 L 520,218" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-data-flow-arrow)"/><path d="M 724,218 L 766,218" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-data-flow-arrow)"/><path d="M 970,218 L 1012,218" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#comment-101-data-flow-arrow)"/><rect x="40" y="160" width="192" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="56" y="188" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" >01</text><text x="56" y="215" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Original and context</text><text x="56" y="240" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Text · author · parent comment</text><text x="56" y="260" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Content · exposure · version</text><rect x="286" y="160" width="192" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="302" y="188" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" >02</text><text x="302" y="215" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Basic normalization</text><text x="302" y="240" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Format · encoding · idempotency</text><text x="302" y="260" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Preserve link and media structure</text><rect x="532" y="160" width="192" height="116" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/><text x="548" y="188" fill="#bf4520" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" >03</text><text x="548" y="215" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Moderation and anti-abuse</text><text x="548" y="240" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Content risk / behavior risk</text><text x="548" y="260" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Allow · hold · reject</text><rect x="778" y="160" width="192" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="794" y="188" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" >04</text><text x="794" y="215" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Semantics and deduplication</text><text x="794" y="240" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Entities · questions · experiences</text><text x="794" y="260" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Near-duplicate clusters · confidence</text><rect x="1024" y="160" width="192" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.16"/><text x="1040" y="188" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" >05</text><text x="1040" y="215" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Versioned event view</text><text x="1040" y="240" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Original + derived labels</text><text x="1040" y="260" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="start" >Moderation state · processing version</text><path d="M 1120,276 L 1120,322 Q 1120,330 1112,330 L 648,330 Q 640,330 640,338 L 640,390" fill="none" stroke="#4f5d75" stroke-width="1.4"/><path d="M 240,330 L 240,390" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url