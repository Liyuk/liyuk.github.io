-serif" text-anchor="start">Comment</text><text x="324" y="221" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">id · author_id</text><text x="324" y="239" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">target_type · target_id</text><text x="324" y="257" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">body · version · status</text><text x="324" y="275" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">parent_id · root_id · depth ∈ {0,1}</text><rect x="690" y="135" width="285" height="112" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="704" y="155" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">CURRENT RELATION</text><text x="704" y="178" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Reaction</text><text x="704" y="201" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">user_id · target_ref · action</text><text x="704" y="219" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">active + unique key</text><text x="704" y="237" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Current like / save state</text><rect x="690" y="300" width="285" height="108" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="704" y="320" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">GOVERNANCE</text><text x="704" y="343" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Moderation case</text><text x="704" y="366" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Object version · stage · decision</text><text x="704" y="384" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Model and rule versions · human review</text><text x="704" y="402" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Rationale · appeal · audit trail</text><rect x="310" y="450" width="265" height="100" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="324" y="470" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">IMMUTABLE FACTS</text><text x="324" y="493" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Event log</text><text x="324" y="516" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Comment, interaction, and moderation changes</text><text x="324" y="534" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">event_id · object_version</text><rect x="690" y="470" width="285" height="102" rx="7" fill="#f9eee9" stroke="#bf4520" stroke-width="1.4" stroke-opacity="0.55"/><text x="704" y="490" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">REBUILDABLE VIEW</text><text x="704" y="513" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Downstream projections</text><text x="704" y="536" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Comment lists · counters · search index</text><text x="704" y="554" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Recommendation features · AI retrieval view</text><text x="466" y="418" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">changes</text><text x="585" y="536" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">versioned events</text><text x="838" y="442" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">rebuild / retract</text><text x="40" y="625" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Constraint: enforce polymorphic target integrity in services or association tables. Counters and event projections do not determine current comment state.</text></svg>