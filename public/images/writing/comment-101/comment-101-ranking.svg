<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
<title id="title">Comment ranking: decide eligibility before order</title>
<desc id="desc">Track creator controls separately from organic popularity; safety and permissions come first.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#4f5d75"/></marker><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#2d3142}.muted{fill:#4f5d75}.card{fill:#fff;stroke:#2d3142;stroke-opacity:.18}.accent{fill:#bf4520}</style></defs>
<rect width="920" height="540" fill="#f5f5f5"/>
<text x="36" y="34" class="muted" font-size="12" font-weight="700" letter-spacing="1">PRODUCT / COMMENT RANKING</text>
<text x="36" y="70" font-size="24" font-weight="700">Comment ranking: decide eligibility before order</text>
<text x="36" y="98" class="muted" font-size="14">Track creator controls separately from organic popularity; safety and permissions come first</text>
<g stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"><path d="M202 205h28"/><path d="M378 205h28"/><path d="M554 205h28"/><path d="M730 205h28"/></g>
<g>
<rect class="card" x="34" y="145" width="168" height="126" rx="8"/><text x="50" y="174" class="muted" font-size="12" font-weight="700">01 / ELIGIBILITY</text><text x="50" y="207" font-size="17" font-weight="700">Eligibility</text><text x="50" y="235" class="muted" font-size="13">State · permissions · blocks</text><text x="50" y="255" class="muted" font-size="13">Parent and risk state</text>
<rect class="card" x="210" y="145" width="168" height="126" rx="8"/><text x="226" y="174" class="muted" font-size="12" font-weight="700">02 / TASK</text><text x="226" y="207" font-size="17" font-weight="700">Choose a reading task</text><text x="226" y="235" class="muted" font-size="13">Newest · answered</text><text x="226" y="255" class="muted" font-size="13">Creator replies · live</text>
<rect x="386" y="145" width="168" height="126" rx="8" fill="#fff8f5" stroke="#bf4520" stroke-width="1.5"/><text x="402" y="174" class="accent" font-size="12" font-weight="700">03 / RANK</text><text x="402" y="207" font-size="17" font-weight="700">Rank organic candidates</text><text x="402" y="235" class="muted" font-size="13">Relevance · freshness · usefulness</text><text x="402" y="255" class="muted" font-size="13">Answer quality and relationships</text>
<rect class="card" x="562" y="145" width="168" height="126" rx="8"/><text x="578" y="174" class="muted" font-size="12" font-weight="700">04 / DEBIAS</text><text x="578" y="207" font-size="17" font-weight="700">Correct for exposure</text><text x="578" y="235" class="muted" font-size="13">Position · time posted</text><text x="578" y="255" class="muted" font-size="13">Risk · diversity</text>
<rect class="card" x="738" y="145" width="148" height="126" rx="8"/><text x="752" y="174" class="muted" font-size="12" font-weight="700">05 / SERVE</text><text x="752" y="207" font-size="17" font-weight="700">Present and log</text><text x="752" y="235" class="muted" font-size="13">Position · expansion · interaction</text><text x="752" y="255" class="muted" font-size="13">Record in experiment logs</text>
</g>
<rect x="76" y="316" width="300" height="76" rx="8" fill="#ececec" stroke="#2d3142" stroke-opacity=".18"/><text x="96" y="345" font-size="15" font-weight="700">Creator and operations controls</text><text x="96" y="371" class="muted" font-size="13">Pins · featured items · expiry; retain provenance</text><path d="M376 354h30v-56" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="406" y="316" width="438" height="76" rx="8" fill="#fff8f5" stroke="#bf4520" stroke-opacity=".45"/><text x="625" y="346" text-anchor="middle" font-size="15" font-weight="700">List = fixed controls + bias-corrected organic ranking</text><text x="625" y="372" text-anchor="middle" class="muted" font-size="13">Keep ads, creator picks, and organic popularity distinct</text>
<path d="M625 393v28" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="142" y="426" width="636" height="66" rx="8" fill="#ececec" stroke="#2d3142" stroke-opacity=".18"/><text x="460" y="454" text-anchor="middle" font-size="15" font-weight="700">Exposure logs and outcome checks</text><text x="460" y="477" text-anchor="middle" class="muted" font-size="13">Log candidates, filter reasons, version, position, and actual treatment; use a control to measure task outcomes</text>
</svg>
