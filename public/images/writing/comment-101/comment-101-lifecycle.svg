<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="700" viewBox="0 0 1024 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comment-101-lifecycle-title comment-101-lifecycle-desc" id="comment-101-lifecycle-root">
<title id="comment-101-lifecycle-title">Comment lifecycle: moderation and visibility</title><desc id="comment-101-lifecycle-desc">Moderation is a process; visibility is a content state. Record and propagate every change.</desc>
<defs><marker id="comment-101-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker><marker id="comment-101-lifecycle-accent-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#bf4520"/></marker><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;display=swap');</style></defs>
<rect width="1024" height="700" fill="#f5f5f5"/>
<text x="40" y="31" fill="#4f5d75" font-size="11" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">TECHNICAL ARCHITECTURE / COMMENT-101-LIFECYCLE</text>
<text x="40" y="64" fill="#2d3142" font-size="24" font-weight="500" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif">Comment lifecycle: moderation workflow and visibility</text>
<text x="40" y="88" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">Moderation is a governance process; visibility is content state. Record and propagate every change</text><rect x="40" y="110" width="944" height="246" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.14"/><text x="58" y="137" fill="#4f5d75" font-size="11" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">A  Comment visibility (branches by rule, not a linear pipeline)</text><path d="M220 203 H310" fill="none" stroke="#bf4520" stroke-width="1.45" marker-end="url(#accent-arrow)"/><path d="M220 222 H270 V278 H310" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M385 243 V220" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M460 278 H600" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M460 190 H735" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M675 278 H735" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M600 300 H565 V330 H145 V243" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M460 222 H510 V278 H460" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><rect x="70" y="166" width="150" height="78" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="83" y="185" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">STATUS</text><text x="83" y="208" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Pending review</text><text x="83" y="229" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">pending_review</text><rect x="310" y="164" width="150" height="78" rx="7" fill="#f9eee9" stroke="#bf4520" stroke-width="1.4" stroke-opacity="0.55"/><text x="323" y="183" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">STATUS</text><text x="323" y="206" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Visible</text><text x="323" y="227" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">visible</text><rect x="310" y="243" width="150" height="78" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="323" y="262" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">STATUS</text><text x="323" y="285" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Held / limited reach</text><text x="323" y="306" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">held</text><rect x="600" y="243" width="150" height="78" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="613" y="262" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">STATUS</text><text x="613" y="285" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Rejected / hidden</text><text x="613" y="306" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">rejected · removed</text><rect x="735" y="164" width="210" height="78" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="748" y="183" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">TERMINAL / POLICY</text><text x="748" y="206" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Deleted or no longer shown</text><text x="748" y="227" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">deleted · visibility off</text><text x="230" y="195" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Automated or human approval</text><text x="240" y="271" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Risk flagged / review needed</text><text x="391" y="237" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Review overturns decision</text><text x="505" y="180" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Deletion / platform action</text><text x="510" y="271" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Reject</text><text x="303" y="341" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Reopen / appeal</text><rect x="40" y="376" width="944" height="150" rx="8" fill="#ececec" stroke="#2d3142" stroke-opacity="0.14"/><text x="58" y="402" fill="#4f5d75" font-size="11" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">B  Moderation and governance (not every comment needs every human step)</text><path d="M222 462 H250" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M422 462 H450" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M622 462 H650" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M822 462 H850" fill="none" stroke="#4f5d75" stroke-width="1.45" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="50" y="420" width="172" height="84" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="63" y="439" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">1 · AUTOMATED</text><text x="63" y="462" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Automated triage</text><text x="63" y="483" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Rules + models</text><text x="63" y="500" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Low risk / review needed</text><rect x="250" y="420" width="172" height="84" rx="7" fill="#f9eee9" stroke="#bf4520" stroke-width="1.4" stroke-opacity="0.55"/><text x="263" y="439" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">2 · HUMAN</text><text x="263" y="462" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">First human review</text><text x="263" y="483" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Check evidence</text><text x="263" y="500" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Approve / escalate</text><rect x="450" y="420" width="172" height="84" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="463" y="439" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">3 · ESCALATION</text><text x="463" y="462" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Second review / appeal</text><text x="463" y="483" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">High risk · disputed</text><text x="463" y="500" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Record every reversal</text><rect x="650" y="420" width="172" height="84" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="663" y="439" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">4 · QUALITY</text><text x="663" y="462" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">AI sampling</text><text x="663" y="483" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Sample completed decisions</text><text x="663" y="500" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Reopen cases when issues are found</text><rect x="850" y="420" width="115" height="84" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="863" y="439" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">AUDIT CASE</text><text x="863" y="462" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Moderation case</text><text x="863" y="483" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Versioned record</text><rect x="40" y="548" width="944" height="105" rx="8" fill="#ffffff" stroke="#bf4520" stroke-opacity="0.5"/><text x="58" y="573" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">C  State events and downstream withdrawal</text><text x="58" y="599" fill="#2d3142" font-size="10" font-weight="500" font-family="ui-monospace, monospace" text-anchor="start">comment_id · object_version · action · reason · policy/model_version · actor · occurred_at</text><path d="M560 611 H645" fill="none" stroke="#bf4520" stroke-width="1.45" marker-end="url(#accent-arrow)"/><text x="665" y="603" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Lists · caches · notifications · search · features</text><text x="665" y="625" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Update idempotently by version. Hides, deletions, and reversals trigger withdrawal.</text></svg>