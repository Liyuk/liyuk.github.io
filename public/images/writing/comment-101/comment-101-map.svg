<svg width="960" height="610" viewBox="0 0 960 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="comment-101-map-title comment-101-map-desc" id="comment-101-map-root">
<title id="comment-101-map-title">Comment Systems 101: five-part reading path</title>
<desc id="comment-101-map-desc">The series guide comes first, followed by articles on metrics, product and supply, ranking and governance, data models, and algorithms.</desc>
<defs>
  <style>
    #comment-101-map-root { color: #2d3142; font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    #comment-101-map-root .label { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    #comment-101-map-root .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
    #comment-101-map-root .serif { font-family: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; }
  </style>
  <marker id="comment-101-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="comment-101-map-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="960" height="610" fill="#f5f5f5"/>

<text x="40" y="34" fill="#4f5d75" font-size="12" font-weight="600" class="mono">COMMENT 101 / SERIES GUIDE</text>
<text x="40" y="72" fill="#2d3142" font-size="26" font-weight="500" class="serif">Comment Systems 101 · Reading path</text>
<text x="40" y="98" fill="#4f5d75" font-size="13" class="label">Start with the overview, then explore metrics, product, governance, and engineering</text>

<rect x="64" y="124" width="832" height="92" rx="7" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
<rect x="82" y="142" width="38" height="26" rx="3" fill="#bf4520" fill-opacity="0.12"/>
<text x="101" y="160" text-anchor="middle" fill="#bf4520" font-size="12" font-weight="700" class="mono">01</text>
<text x="136" y="160" fill="#2d3142" font-size="17" font-weight="700" class="label">Series guide</text>
<text x="82" y="190" fill="#4f5d75" font-size="13" class="label">Why are comment systems layered? How do the five articles fit together?</text>
<text x="874" y="163" text-anchor="end" fill="#bf4520" font-size="12" font-weight="600" class="label">Map the whole system</text>

<path d="M 480 216 L 480 238 L 144 238 L 144 254" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#comment-101-map-arrow)"/>

<g class="label">
  <rect x="40" y="260" width="208" height="252" rx="7" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.18"/>
  <rect x="56" y="278" width="34" height="24" rx="3" fill="#ececec"/>
  <text x="73" y="295" text-anchor="middle" fill="#4f5d75" font-size="11" font-weight="700" class="mono">02</text>
  <text x="56" y="330" fill="#2d3142" font-size="16" font-weight="700">Metrics and experiments</text>
  <text x="56" y="354" fill="#4f5d75" font-size="12">What is the system optimizing for?</text>
  <line x1="56" y1="369" x2="232" y2="369" stroke="#2d3142" stroke-opacity="0.16"/>
  <text x="60" y="398" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="76" y="398" fill="#2d3142" font-size="12">North Star and metric tree</text>
  <text x="60" y="425" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="76" y="425" fill="#2d3142" font-size="12">Dwell time, LTV, and decision value</text>
  <text x="60" y="452" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="76" y="452" fill="#2d3142" font-size="12">Experiments and proxy validity</text>
  <text x="56" y="488" fill="#4f5d75" font-size="11">Define outcomes by user task</text>

  <rect x="264" y="260" width="208" height="252" rx="7" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.18"/>
  <rect x="280" y="278" width="34" height="24" rx="3" fill="#ececec"/>
  <text x="297" y="295" text-anchor="middle" fill="#4f5d75" font-size="11" font-weight="700" class="mono">03</text>
  <text x="280" y="330" fill="#2d3142" font-size="16" font-weight="700">Product and supply</text>
  <text x="280" y="354" fill="#4f5d75" font-size="12">How do people contribute and return?</text>
  <line x1="280" y1="369" x2="456" y2="369" stroke="#2d3142" stroke-opacity="0.16"/>
  <text x="284" y="398" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="300" y="398" fill="#2d3142" font-size="12">Comment forms and expression</text>
  <text x="284" y="425" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="300" y="425" fill="#2d3142" font-size="12">Supply, demand, incentives, and cold start</text>
  <text x="284" y="452" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="300" y="452" fill="#2d3142" font-size="12">Community and multilingual design</text>
  <text x="280" y="488" fill="#4f5d75" font-size="11">Turn goals into participation</text>

  <rect x="488" y="260" width="208" height="252" rx="7" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.18"/>
  <rect x="504" y="278" width="34" height="24" rx="3" fill="#ececec"/>
  <text x="521" y="295" text-anchor="middle" fill="#4f5d75" font-size="11" font-weight="700" class="mono">04</text>
  <text x="504" y="330" fill="#2d3142" font-size="16" font-weight="700">Ranking and governance</text>
  <text x="504" y="354" fill="#4f5d75" font-size="12">Which voices remain and get seen?</text>
  <line x1="504" y1="369" x2="680" y2="369" stroke="#2d3142" stroke-opacity="0.16"/>
  <text x="508" y="398" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="524" y="398" fill="#2d3142" font-size="12">Visibility and ranking</text>
  <text x="508" y="425" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="524" y="425" fill="#2d3142" font-size="12">Moderation, abuse controls, and appeals</text>
  <text x="508" y="452" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="524" y="452" fill="#2d3142" font-size="12">Permissions, corrections, and lifecycle</text>
  <text x="504" y="488" fill="#4f5d75" font-size="11">Manage exposure and trust</text>

  <rect x="712" y="260" width="208" height="252" rx="7" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.18"/>
  <rect x="728" y="278" width="34" height="24" rx="3" fill="#ececec"/>
  <text x="745" y="295" text-anchor="middle" fill="#4f5d75" font-size="11" font-weight="700" class="mono">05</text>
  <text x="728" y="330" fill="#2d3142" font-size="16" font-weight="700">Data and algorithms</text>
  <text x="728" y="354" fill="#4f5d75" font-size="12">How can data be reused reliably?</text>
  <line x1="728" y1="369" x2="904" y2="369" stroke="#2d3142" stroke-opacity="0.16"/>
  <text x="732" y="398" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="748" y="398" fill="#2d3142" font-size="12">Domain models and data processing</text>
  <text x="732" y="425" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="748" y="425" fill="#2d3142" font-size="12">Features, recommendations, and search</text>
  <text x="732" y="452" fill="#4f5d75" font-size="14" font-weight="700">·</text><text x="748" y="452" fill="#2d3142" font-size="12">AI search and content withdrawal</text>
  <text x="728" y="488" fill="#4f5d75" font-size="11">Make information traceable and reusable</text>
</g>

<path d="M 248 386 L 258 386" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#comment-101-map-arrow-accent)"/>
<path d="M 472 386 L 482 386" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#comment-101-map-arrow)"/>
<path d="M 696 386 L 706 386" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#comment-101-map-arrow)"/>

<rect x="64" y="548" width="832" height="42" rx="4" fill="#ececec" stroke="#2d3142" stroke-opacity="0.12"/>
<text x="480" y="574" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" class="label">One place review runs through all five articles; governance applies across product and data flows</text>
</svg>
