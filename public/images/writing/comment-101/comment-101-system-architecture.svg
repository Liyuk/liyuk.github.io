 / analytics features</text><text x="778" y="444" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Exposure correction · interaction labels</text><text x="778" y="461" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Governance filters · time windows</text><path d="M145 475 V518" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M380 475 V518" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M640 475 V518" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M865 475 V518" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><rect x="45" y="518" width="200" height="66" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="58" y="537" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">SERVING</text><text x="58" y="560" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Moderation console</text><text x="58" y="581" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Queue · review · appeals</text><rect x="280" y="518" width="200" height="66" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="293" y="537" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">SERVING</text><text x="293" y="560" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Comment section</text><text x="293" y="581" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Pagination · ranking · interaction state</text><rect x="540" y="518" width="200" height="66" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="553" y="537" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">SERVING</text><text x="553" y="560" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Search and answers</text><text x="553" y="581" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Site search · traceable citations</text><rect x="765" y="518" width="200" height="66" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="778" y="537" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">SERVING</text><text x="778" y="560" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Recommendations and analytics</text><text x="778" y="581" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Feed · commerce/ads · metrics</text><text x="40" y="625" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Moderation decisions return to the domain service with the object version; state changes then emit events. Consumers can retry or replay. Monitor withdrawal propagation time.</text></svg>