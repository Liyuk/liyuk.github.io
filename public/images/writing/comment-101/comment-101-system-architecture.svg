<text x="40" y="64" fill="#2d3142" font-size="24" font-weight="500" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif">Comment system architecture: one write, multiple projections</text>
<text x="40" y="88" fill="#4f5d75" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">The domain service owns authoritative state. Consumers are idempotent and retryable; withdrawals are traceable.</text><path d="M210 163 H258" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M432 163 H480" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#accent-arrow)"/><path d="M664 163 H710" fill="none" stroke="#bf4520" stroke-width="1.45" marker-end="url(#accent-arrow)"/><rect x="40" y="126" width="170" height="90" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="53" y="145" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">COMMAND</text><text x="53" y="168" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Client / creator tools</text><text x="53" y="189" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Comment · edit · interact</text><rect x="258" y="126" width="174" height="90" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="271" y="145" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">GUARD</text><text x="271" y="168" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">API validation</text><text x="271" y="189" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Identity · permissions · idempotency</text><text x="271" y="206" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">expected_version</text><rect x="480" y="126" width="184" height="90" rx="7" fill="#f9eee9" stroke="#bf4520" stroke-width="1.4" stroke-opacity="0.55"/><text x="493" y="145" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">DOMAIN</text><text x="493" y="168" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Comment domain service</text><text x="493" y="189" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Target · reply depth</text><text x="493" y="206" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">State transitions · authoritative writes</text><rect x="710" y="126" width="274" height="90" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="723" y="145" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">TRANSACTION</text><text x="723" y="168" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">State + outbox</text><text x="723" y="189" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Same transaction boundary; events can be replayed</text><text x="723" y="206" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Current comment / reaction state</text><path d="M847 216 V247 H520 V265" fill="none" stroke="#bf4520" stroke-width="1.45" marker-end="url(#accent-arrow)"/><rect x="390" y="265" width="260" height="68" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="403" y="284" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">DELIVERY</text><text x="403" y="307" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Event bus</text><text x="403" y="328" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">event_id · object_version</text><text x="403" y="345" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">At-least-once delivery; idempotent consumers</text><path d="M520 333 V356 H145 V381" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M520 356 H380 V381" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M520 356 H640 V381" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><path d="M520 356 H865 V381" fill="none" stroke="#4f5d75" stroke-width="1.45" marker-end="url(#arrow)"/><rect x="45" y="381" width="200" height="94" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.2"/><text x="58" y="400" fill="#4f5d75" font-size="9" font-weight="600" font-family="ui-monospace, monospace" text-anchor="start">GOVERNANCE</text><text x="58" y="423" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Moderation consumers</text><text x="58" y="444" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Automated / human review / sampling</text><text x="58" y="461" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="start">Write decisions back to domain service</text><rect x="280" y="381" width="200" height="94" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacit