<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="grok-bot-harness-architecture-title grok-bot-harness-architecture-desc"><title id="grok-bot-harness-architecture-title">Grok Bot dispatch architecture</title><desc id="grok-bot-harness-architecture-desc">A proposed operating architecture: a human sets goals, Grok routes task cards through department chiefs and external harnesses, isolated workspaces return evidence for two-track acceptance, and GitHub state returns to Grok.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker></defs><rect class="bg" width="100%" height="100%"/><style>text{font-family:Geist,'Noto Sans SC',Arial,sans-serif;fill:#2d3142}.bg{fill:#f5f5f5}.node{fill:#f5f5f5;stroke:#2d3142;stroke-width:1.2}.focal{fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-width:1.5}.name{font-size:15px;font-weight:600;text-anchor:middle}.sub{font-size:10px;fill:#5a6580;text-anchor:middle}.line{fill:none;stroke:#4f5d75;stroke-width:1.4;marker-end:url(#arrow)}.dashed{stroke-dasharray:5 4}.title{font-size:12px;fill:#4f5d75;letter-spacing:1.4px}</style><text class="title" x="48" y="34">PROPOSED DISPATCH ARCHITECTURE · NOT GROK INTERNALS</text><path class="line" d="M250 106H350"/><path class="line" d="M410 144V192H180V242"/><path class="line" d="M300 277H350"/><path class="line" d="M650 277H700"/><path class="line" d="M820 312V354H500V390"/><path class="line" d="M500 458V490"/><path class="line" d="M630 524H680"/><path class="line dashed" d="M900 524H960V106H650"/><g><rect class="node" x="60" y="68" width="190" height="76" rx="6"/><text class="name" x="155.0" y="97">Human owner</text><text class="sub" x="155.0" y="117">goal · context · decisions</text></g><g><rect class="node focal" x="350" y="68" width="300" height="76" rx="6"/><text class="name" x="500.0" y="97">Grok dispatcher</text><text class="sub" x="500.0" y="117">task cards · routing · acceptance</text></g><g><rect class="node" x="60" y="242" width="240" height="70" rx="6"/><text class="name" x="180.0" y="271">Department chief</text><text class="sub" x="180.0" y="291">priority · dependency · ownership</text></g><g><rect class="node" x="350" y="242" width="300" height="70" rx="6"/><text class="name" x="500.0" y="271">External harnesses</text><text class="sub" x="500.0" y="291">GPT · Claude · DeepSeek</text></g><g><rect class="node" x="700" y="242" width="240" height="70" rx="6"/><text class="name" x="820.0" y="271">Isolated workspaces</text><text class="sub" x="820.0" y="291">cloud VM · container · worktree</text></g><g><rect class="node" x="370" y="390" width="260" height="68" rx="6"/><text class="name" x="500.0" y="419">Artifacts and evidence</text><text class="sub" x="500.0" y="439">diff · tests · logs · status</text></g><g><rect class="node focal" x="370" y="490" width="260" height="68" rx="6"/><text class="name" x="500.0" y="519">Dual acceptance</text><text class="sub" x="500.0" y="539">machine checks + independent review</text></g><g><rect class="node" x="680" y="490" width="220" height="68" rx="6"/><text class="name" x="790.0" y="519">GitHub task state</text><text class="sub" x="790.0" y="539">Discussion · Issue · PR</text></g><text class="sub" x="944" y="306" transform="rotate(-90 944 306)">verified state returns to Grok</text></svg>